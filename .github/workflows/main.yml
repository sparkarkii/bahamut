name: bahamut workflow

on:
  schedule:
    - cron: "00 16 * * *"    #runs everyday
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: checkout main repo
        uses: actions/checkout@v6.0.2
      - name: checkout utils repo
        uses: actions/checkout@v6.0.2
        with:
          repository: sparkarkii/utils
          path: utils
      - name: setup python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: 3.14
      - name: install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install
      - name: execute script
        env:
            EMAIL: ${{ secrets.EMAIL }}
            EMAIL_PW: ${{ secrets.EMAIL_PW }}
            BAHAMUT_ID: ${{ secrets.BAHAMUT_ID }}
            BAHAMUT_PW: ${{ secrets.BAHAMUT_PW }}
        run: |
          python login.py
